/**:
  ros__parameters:
    # 【本项目调整】参与运动的障碍物数量。原为 1，只让 cylinder_0 动，
    # 场景里另外 4 个圆柱保持静止且多在 5 m 感知范围外 → 感知只看到 1 个目标，
    # D-CBF 的避障几乎没有考验。改为 5 后可让全部 5 个圆柱按其各自的
    # (x_i, y_i, vx_i, vy_i) 一起运动，障碍数量与动态性都更充分。
    cylinder_num: 5

    x_0: 2.0
    y_0: 2.0
    z_0: 0.25
    vx_0: 0.0
    # vy_0: 0.0
    vy_0: -0.1

    x_1: -2.0
    y_1: 2.0
    z_1: 0.25
    vx_1: 0.1
    # vy_1: 0.0
    vy_1: -0.1

    x_2: 2.0
    y_2: -2.0
    z_2: 0.25
    vx_2: 0.1
    # vy_2: 0.0
    vy_2: 0.1
    
    # 【本项目调整】静态障碍物之一：速度置 0，作为固定障碍摆在场地里，
    # 与另外 3 个动态圆柱共同构成"动静混合"场景。
    x_3: -2.0
    y_3: -2.0
    z_3: 0.25
    vx_3: 0.0
    # vy_3: 0.5
    vy_3: 0.0

    # 【本项目调整】第 2 个静态障碍物：原位置 (-2, -5) 距原点 5.4 m，
    # 已在 5 m 感知半径之外（localmap_x_size=10.0 → ±5 m），几乎看不到；
    # 移到 (0, 3.5) 距原点 3.5 m，确保被稳定感知；速度置 0。
    x_4: 0.0
    y_4: 3.5
    z_4: 0.25
    vx_4: 0.0
    # vy_4: 0.0
    vy_4: 0.0
